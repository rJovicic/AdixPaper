name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 18 is what production runs (Railway postgres-ssl:18); 16 keeps older setups covered.
        postgres: ['16', '18']
    name: backend (Postgres ${{ matrix.postgres }})
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: adix_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests
      - run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/adix_test

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check:i18n
      - run: npm run build
      - run: npm audit --omit=dev

  upgrade:
    # A database created and filled by the release on main must survive this branch's startup
    # migration unchanged, on the PostgreSQL version production runs.
    needs: [backend]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: upgr
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: production
      SECRET_KEY: ci-only-upgrade-secret-key-not-for-production
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin-pass-123
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/upgr
      FRONTEND_DIST: /tmp/dist
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements.txt
      - name: Previous release creates and fills the database
        run: |
          mkdir -p /tmp/dist && echo '<!doctype html>' > /tmp/dist/index.html
          git worktree add /tmp/previous "${{ github.event.pull_request.base.sha || 'origin/main' }}"
          cd /tmp/previous/backend && (uvicorn app.main:app --port 8000 > /tmp/previous.log 2>&1 &)
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 1; done
          python3 /tmp/previous/e2e/seed-demo.py http://localhost:8000
          python3 "$GITHUB_WORKSPACE/e2e/upgrade-check.py" snapshot http://localhost:8000 > /tmp/before.json
          pkill -f "uvicorn app.main:app"
          for i in $(seq 1 20); do curl -s -o /dev/null localhost:8000/health || break; sleep 0.5; done
      - name: This branch upgrades it
        run: |
          cd backend && (uvicorn app.main:app --port 8000 > /tmp/upgraded.log 2>&1 &)
          for i in $(seq 1 30); do curl -fs localhost:8000/health && break; sleep 1; done
          psql postgresql://postgres:postgres@localhost:5432/upgr -Atc "select version()"
          python3 "$GITHUB_WORKSPACE/e2e/upgrade-check.py" verify http://localhost:8000 /tmp/before.json
      - name: App logs
        if: failure()
        run: cat /tmp/previous.log /tmp/upgraded.log

  e2e:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: adixpaper
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build the production image
        run: docker build -t adixpaper:ci .
      - name: Start the app
        run: |
          docker run -d --name adix --network host \
            -e PORT=8000 -e APP_ENV=production -e SECRET_KEY=ci-only-secret-key-not-for-production \
            -e ADMIN_USERNAME=admin -e ADMIN_PASSWORD=admin-pass-123 \
            -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/adixpaper adixpaper:ci
          for i in $(seq 1 30); do curl -fs http://localhost:8000/health && break; sleep 2; done
          python3 e2e/seed-demo.py http://localhost:8000
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('e2e/package-lock.json') }}
      - name: Run end-to-end tests
        working-directory: e2e
        # The runner image already ships Chromium's system libraries; installing them
        # with --with-deps pulls ~26 MB from Ubuntu mirrors and once took 9 minutes.
        run: |
          npm ci
          npx playwright install chromium
          npx playwright test
        env:
          E2E_BASE_URL: http://localhost:8000
      - name: App logs
        if: failure()
        run: docker logs adix
